name: Backfill EloBoard matches

# 누락·삭제된 EloBoard 경기를 복구할 때 수동으로 한 번 돌린다.
# 이미 받은 경기까지 처음부터 끝까지 다시 읽어 upsert하고, 아무것도 지우지 않는다.
# 전체 약 35만 경기(≈1,900페이지) · 2초 간격이라 1시간 반 정도 걸린다.
on:
  workflow_dispatch:

concurrency:
  group: ststat-main-pipeline
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  STSTAT_ENV: production
  PYTHONUNBUFFERED: "1"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Re-read all EloBoard matches
        env:
          ELOBOARD_BACKFILL: "1"
          # EloBoard 요청: 페이지 사이 2초 간격을 지킨다(줄이지 말 것)
          ELOBOARD_DELAY: "2.0"
        run: python scripts/run_job.py sync_eloboard
      # 되살린 경기를 지난 방송통계의 스폰 승패에도 반영한다(바뀐 날만 다시 게시)
      - name: Recount past Synergy sponsor stats
        run: python scripts/run_job.py refresh_synergy_sponsor
