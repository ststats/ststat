name: Restore EloBoard matches from backup JSON

# staruniv의 EloBoard 경기 백업(2026-09-22)을 elo_matches에 다시 넣는다(삭제 없음).
# EloBoard에 요청하지 않는다. 끝나면 일반 파이프라인을 돌려 그 뒤 경기를 채운다.
on:
  workflow_dispatch:

concurrency:
  group: ststat-main-pipeline
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  STSTAT_ENV: production
  PYTHONUNBUFFERED: "1"

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_job.py restore_eloboard_json
