name: 전적 전체 수집 (한 번 쓰고 버리는 저장소용)

# eloboard 전 경기를 한 번에 받아(약 1시간) 아래 두 가지를 만든다.
#   data/eloboard.json   - 원본 아카이브 (본 저장소 data/ 에 넣을 파일, 약 14MB)
#   docs/data/h2h/       - 상대전적 탭이 읽는 선수별 파일
# 결과는 Actions 아티팩트(eloboard-data)로 내려받고, 이 저장소는 지워버리면 된다.
#
# [왜 따로 돌리나] robots.txt의 Crawl-delay 2초를 지키면 약 1,974요청 × 2초 = 1시간이 넘는다.
# 본 저장소의 평소 워크플로우는 증분(요청 1~2회)만 받게 해 두었다.
on:
  workflow_dispatch:
    inputs:
      delay:
        description: '요청 간격(초) - eloboard robots.txt 권장값 2'
        type: string
        default: '2'
      commit:
        description: '결과를 이 저장소에도 커밋 (Workflow permissions 가 Read and write 여야 함)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # 1,974요청 × 2초 ≈ 70분. 넉넉히 잡는다

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'      # 표준 라이브러리만 쓴다 - 설치할 패키지 없음

    - name: 전적 전체 수집 (약 1시간)
      run: python scripts/sync_eloboard.py --full --delay ${{ inputs.delay }}

    - name: 상대전적 파일 만들기
      run: python scripts/build_h2h.py

    - name: 결과 확인
      if: always()
      run: |
        ls -lh data/eloboard.json 2>/dev/null || echo "⚠️ data/eloboard.json 이 없습니다"
        ls docs/data/h2h 2>/dev/null | head -5
        echo "선수별 파일 $(ls docs/data/h2h/p 2>/dev/null | wc -l) 개"

    # 중간에 끊겨도 여기까지 받은 것은 내려받을 수 있게 always()로 올린다.
    - name: 결과 내려받기용 아티팩트 올리기
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: eloboard-data
        path: |
          data/eloboard.json
          docs/data/h2h
        if-no-files-found: warn
        retention-days: 7

    - name: (선택) 이 저장소에도 커밋
      if: inputs.commit
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add -A data docs
        if git diff --staged --quiet; then
          echo "ℹ️ 바뀐 내용이 없습니다."
        else
          git commit -m "🥊 전적 전체 수집"
          git push
        fi
