name: Ranking backtest

# 티어랭킹 되돌려 시험(scripts/ranking_backtest.py). DB를 읽기만 하고 변형마다 따로 돈다.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "다시 맞추는 간격(일)"
        default: "7"
      tune_from:
        description: "이 날부터 --start(2025-01-01) 앞까지는 값 고르기용"
        default: "2024-01-01"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # G = EloBoard 공지 방식(Glicko) 재현, A = 지금 티어랭킹(폼 반감기 90/45/30일)
        include:
          - variant: G
            half_life: "90"
          - variant: A
            half_life: "90"
          - variant: A
            half_life: "45"
          - variant: A
            half_life: "30"
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STSTAT_ENV: production
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          python scripts/ranking_backtest.py --variant "${{ matrix.variant }}" --step "${{ inputs.step }}"
          --tune-from "${{ inputs.tune_from }}" --half-life "${{ matrix.half_life }}"
