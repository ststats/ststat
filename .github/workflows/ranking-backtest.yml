name: Ranking backtest

# 티어랭킹 되돌려 시험(scripts/ranking_backtest.py). DB를 읽기만 하고 변형마다 따로 돈다.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "다시 맞추는 간격(일)"
        default: "7"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B, D]
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STSTAT_ENV: production
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/ranking_backtest.py --variant "${{ matrix.variant }}" --step "${{ inputs.step }}"
