name: Rider automated comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        profile: [desktop, mobile]
        entrants: [8, 48]
        group: [graphics, layers, activity, pipeline]
    env:
      GROUP: ${{ matrix.group }}
      PROFILE: ${{ matrix.profile }}
      ENTRANTS: ${{ matrix.entrants }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node perf/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rider-${{ matrix.group }}-${{ matrix.profile }}-${{ matrix.entrants }}
          path: results/
          retention-days: 7
