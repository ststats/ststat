name: Rebuild EloBoard models

on:
  workflow_dispatch:

permissions:
  contents: read

# Regular collection and manual rebuild must not publish competing snapshots.
concurrency:
  group: ststat-main-pipeline
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  rebuild:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STSTAT_ENV: production
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/retry_job.sh calculate_eloboard_stats
