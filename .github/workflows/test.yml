name: Test ststat

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # 일회성: Actions 실행 기록 전부 삭제(새로 시작). 시간당 요청 한도(1000) 안에서 지우고 멈춘다. 끝나면 이 job을 뺀다.
  cleanup-old-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          while :; do
            left=$(gh api rate_limit --jq '.resources.core.remaining')
            [ "$left" -lt 30 ] && { echo "요청 한도 거의 다 씀($left). 한 시간 뒤 다시 돌리면 이어서 지웁니다"; break; }
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .status == \"completed\") | .id")
            [ -z "$ids" ] && { echo "남은 기록 없음"; break; }
            for id in $ids; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null && n=$((n+1))
              [ $((n % 50)) -eq 0 ] && echo "지운 기록 $n개"
            done
          done
          echo "이번에 지운 기록: $n개"
          echo "남은 기록: $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=1" --jq '.total_count')개"
