name: Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ststat-main-pipeline
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  STSTAT_ENV: production
  PYTHONUNBUFFERED: "1"

# 두 번 돌려도 같은 작업만 retry_job.sh로 다시 시도한다(sync_eloboard는 삭제 판정이 앞 실행 기록에 기대 제외).
jobs:
  # 테스트가 통과해야 공유 DB에 쓴다.
  test:
    uses: ./.github/workflows/test.yml

  foundation:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/retry_job.sh healthcheck
      # 명단 동기화가 실패해도 DB에 있는 명단으로 뒤 작업을 계속한다(healthcheck 실패는 멈춘다).
      - name: Sync roster
        continue-on-error: true
        run: python scripts/run_job.py sync_roster

  eloboard:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      # 멈춰 둔 동안(skipped)은 새 경기가 없을 뿐 수집 실패가 아니라 시너지 지난달 확정을 미루지 않는다
      ok: ${{ steps.sync.outcome == 'success' || steps.sync.outcome == 'skipped' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # EloBoard가 2026-11 개편 뒤 자동 수집(/api/)을 막아(robots.txt·nginx 403) 실패해도 뒤 작업은 기존 경기로 계속한다.
      # 경기를 다 받은 뒤에야 쓰므로(sync_eloboard) 실패해도 반쯤 쓴 경기는 없다. 성공 여부는 outputs.ok로 넘긴다
      # 2026-11-09부터 멈춤. 다시 돌리려면 저장소 변수 ELOBOARD_SYNC=on
      - name: Sync EloBoard matches
        id: sync
        continue-on-error: true
        if: ${{ vars.ELOBOARD_SYNC == 'on' }}
        env:
          ELOBOARD_DELAY: "2.0"
          ELOBOARD_OVERLAP_DAYS: "3"
        run: python scripts/run_job.py sync_eloboard

  derived:
    needs: eloboard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/retry_job.sh calculate_eloboard_stats

  # 경기 수집이 실패해도 갱신한다. 수집 도중의 경기를 읽지 않게 끝나기는 기다린다(ELOBOARD_OK).
  synergy:
    needs: [foundation, eloboard]
    if: ${{ !cancelled() && needs.foundation.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ELOBOARD_OK: ${{ needs.eloboard.result == 'success' && needs.eloboard.outputs.ok == 'true' }}
      # 기본 풍고, 트래키파이로 받으려면 저장소 변수 MONTHLY_SOURCE=trackify
      MONTHLY_SOURCE: ${{ vars.MONTHLY_SOURCE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/retry_job.sh sync_synergy_daily

  videos:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/retry_job.sh sync_videos

  member_videos:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # 멤버마다 최근 20개만 쓰므로 업로드 목록은 첫 쪽(50개)만 받는다
      YOUTUBE_RECENT_PAGES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/retry_job.sh sync_member_videos

  audit:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/retry_job.sh audit_match_rounds
