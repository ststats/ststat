name: Pipeline

on:
  workflow_dispatch:

concurrency:
  group: ststat-main-pipeline
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  STSTAT_ENV: production
  PYTHONUNBUFFERED: "1"

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_job.py healthcheck
      # 명단 동기화가 실패해도 지금 DB에 있는 명단으로 뒤 작업(경기 수집·파생·시너지)을 계속한다.
      # 실패는 sync_jobs와 Actions 경고로 남는다. 연결·스키마 점검(healthcheck) 실패는 그대로 멈춘다.
      - name: Sync roster
        continue-on-error: true
        run: python scripts/run_job.py sync_roster

  eloboard:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync EloBoard matches
        env:
          ELOBOARD_DELAY: "2.0"
          ELOBOARD_OVERLAP_DAYS: "3"
        run: python scripts/run_job.py sync_eloboard

  derived:
    needs: eloboard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_job.py calculate_eloboard_stats

  synergy:
    needs: eloboard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_job.py sync_synergy_daily

  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_job.py sync_videos

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_job.py audit_match_rounds
