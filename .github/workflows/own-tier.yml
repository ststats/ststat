name: Own tier report

# 자체 티어(참고용) 보고서. DB를 읽기만 하고(scripts/own_tier_report.py) 결과는 실행 기록의 파일(own-tier)로 받는다.
on:
  workflow_dispatch:
    inputs:
      months:
        description: "되돌려 볼 달 수"
        default: "18"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STSTAT_ENV: production
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/own_tier_report.py --months "${{ inputs.months }}"
      - uses: actions/upload-artifact@v4
        with:
          name: own-tier
          path: out/own_tier/
