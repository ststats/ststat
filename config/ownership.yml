realtime:
  owner: ststat
  executor: cloudflare_worker
  cadence: "2 minutes"
  description: "Realtime broadcast state belongs to the ststat data domain; the existing Cloudflare Worker remains its realtime executor."
  owns:
    - live broadcast status
    - realtime viewer count
    - current broadcast metadata
    - realtime checked timestamps

roster:
  owner: ststat
  executor: external_cron_to_github_actions
  cadence: "4 hours"
  source: eloboard_tier_api
  existing_tier_members_auto_columns:
    - name
  candidate_table: tier_member_candidates
  candidate_behavior: "New API players are staged for review and are never auto-inserted into tier_members."
  protected_manual_columns:
    - nickname
    - soop_id
    - elo_id
    - birth_date
    - gender
    - race
    - tier
    - affiliation
    - role
    - modified_at
    - history
    - started_on
    - elo_registered
    - tier_table_registered
    - promoted_tier_8
    - promoted_tier_7
    - promoted_tier_6
    - promoted_tier_5
    - promoted_tier_4
    - promoted_tier_3
    - promoted_tier_2
    - promoted_tier_1
    - promoted_tier_0
  notes:
    - "modified_at is preserved in Part 2. It will be consumed/cleared only after historical backfill is moved to ststat in a later part."
    - "elo_id remains admin-controlled in Part 2 to preserve current behavior."

batch:
  owner: ststat
  executor: external_cron_to_github_actions
  cadence: "4 hours"
  owns:
    - roster source-name sync
    - roster candidate discovery
    - eloboard source data (future part)
    - poonggo source data (future part)
    - automatic youtube collection (future part)
    - h2h stats (future part)
    - rankings (future part)
    - race stats (future part)
    - daily stats (future part)
    - historical backfill (future part)

staruniv_admin:
  owner: staruniv_admin
  owns:
    - calendar
    - off-air schedule
    - history
    - external tools
    - manual video picks
    - manually managed roster fields
    - team and member manual overrides

rules:
  - "Batch jobs must never overwrite realtime broadcast fields."
  - "Realtime worker must never overwrite batch-derived statistics."
  - "Roster sync may update only explicitly auto-owned tier_members columns."
  - "New players must go to tier_member_candidates for human review."
  - "modified_at must not be cleared until historical backfill owns that lifecycle."
