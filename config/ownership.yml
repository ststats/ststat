realtime:
  owner: ststat
  executor: cloudflare_worker
  cadence: "2 minutes"
  owns:
    - live broadcast status
    - realtime viewer count
    - current broadcast metadata
    - realtime checked timestamps

roster:
  owner: ststat
  executor: external_cron_to_github_actions
  cadence: "4 hours"
  source: eloboard_tier_api
  existing_tier_members_auto_columns:
    - name
  candidate_table: tier_member_candidates
  protected_manual_columns:
    - nickname
    - soop_id
    - elo_id
    - birth_date
    - gender
    - race
    - tier
    - affiliation
    - role
    - modified_at
    - history
    - started_on
  notes:
    - "modified_at remains preserved until historical backfill moves to ststat."

eloboard:
  owner: ststat
  executor: external_cron_to_github_actions
  cadence: "4 hours"
  source: "https://eloboard.co.kr/api/matches"
  owns_tables:
    - elo_categories
    - elo_maps
    - elo_players
    - elo_matches
  behavior:
    - "Incremental collection starts from the newest DB match id and re-reads a 3-day overlap window."
    - "Partial/failed fetches never write matches or delete existing rows."
    - "Unknown elo_ids are staged in tier_member_candidates and never auto-added to tier_members."
    - "H2H/ranking/race calculations remain out of scope until Part 4."

staruniv_admin:
  owner: staruniv_admin
  owns:
    - calendar
    - off-air schedule
    - history
    - external tools
    - manual video picks
    - manually managed roster fields
    - team and member manual overrides

rules:
  - "Batch jobs must never overwrite realtime broadcast fields."
  - "Realtime worker must never overwrite batch-derived statistics."
  - "Roster sync may update only explicitly auto-owned tier_members columns."
  - "EloBoard sync may write only elo_* source tables and candidate staging."
  - "New players must never be auto-inserted into tier_members."

derived_eloboard_stats:
  owner: ststat
  executor: external_cron_to_github_actions
  cadence: "after sync_eloboard (normally every 4 hours)"
  source_tables:
    - elo_matches
    - elo_players
    - elo_maps
    - elo_categories
    - tier_members
  owns_tables:
    - elo_derived_snapshots
    - elo_player_stats
    - elo_h2h_stats
    - elo_race_stats
    - elo_rankings
    - elo_ranking_meta
    - elo_rating_history
  rules:
    - "Derived stats are written as a new snapshot and activated only after the full calculation succeeds."
    - "The current StarUniv H2H/ranking algorithm is preserved during migration."
    - "StarUniv legacy h2h/ranking JSON remains fallback until the web migration step."
    - "This job never updates tier_members or realtime broadcast fields."

synergy_daily_stats:
  owner: ststat
  executor: external_cron_to_github_actions
  cadence: "after calculate_eloboard_stats (normally every 4 hours)"
  external_source:
    - poonggo_monthly_api
  source_tables:
    - tier_members
    - elo_matches
  owns_tables:
    - poonggo_monthly_stats
    - daily_member_stats
    - synergy_month_confirmations
  protected_behavior:
    - "Synergy legacy latest.json/archive remain active during Part 5 validation."
    - "Sponsor stats are calculated from the centralized elo_matches table; EloBoard is not fetched a second time."
    - "A Poonggo partial/undersized response aborts the snapshot write."
    - "tier_members.modified_at is cleared only after historical daily_member_stats metadata backfill succeeds."
    - "No StarUniv/Synergy web read path is changed in Part 5."
