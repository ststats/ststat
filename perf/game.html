* {
  box-sizing:border-box;
}

body {
  margin:0;
}

button,input,select {
  font:inherit;
}

button {
  cursor:pointer;
}

button:disabled {
  opacity:.4;
  cursor:not-allowed;
}

button:focus-visible,input:focus-visible,select:focus-visible {

}

header {
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #ffffff16;
}

h1 {

  margin:0;
}

  color:#a4b3a7;

}

h2 {

  margin:0 0 16px;
}

.workspace {
  height:calc(100dvh - 62px);

  grid-template-columns:208px minmax(0,1fr) 286px;
  gap:10px;
  padding:10px;

.rank-panel,.settings-panel {

}

#itemToast {

.race-actions {

.primary,.small-btn,.text-btn {

  padding:9px 12px;
  background:#34453c;
  color:#e5eddf;
}

.primary {

  color:#1d3022;

}

.text-btn {

.leader {

.leader.focus {

}

.leader>b {

  color:#b2c698;
}

.leader canvas {

.leader-info {

}

.leader-info strong {

.leader>span:last-child {

.settings-panel {

}

.setting-block {

}

.setting-block>label,.setting-block>.block-label {

}

select {

.segmented,.camera-controls {

.segmented button,.camera-controls button {

#cameraLabel {

.panel-head {

.panel-head h2 {

.panel-head h2 span {

  margin-left:4px;
}

.subtle {

}

.add-driver {

}

.add-driver>div {

.add-driver input {

.driver {

  border-radius:6px;
  position:relative;
  color:#d1dfc3;
  min-width:0;
}

.driver canvas {

.driver.active {

.settings-closed .workspace {

.settings-closed .settings-panel {

.cinema .workspace {

.cinema.settings-closed .workspace {

:root {

  }

  .opening #roster {
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:8px;
  }

  .driver strong {
    font-size:12px;
  }

  .lineup-card,.setup-card {
    padding:18px;
  }

  .workspace,.settings-closed .workspace {
    height:auto;
    min-height:calc(100dvh - 64px);
    grid-template-columns:1fr;
    padding:8px;
  }

  .rank-panel {
    grid-row:2;
    max-height:32dvh;
  }

  .race-panel {
    grid-row:1;
    height:74dvh;
    min-height:420px;
  }

  #leaderList {
    grid-template-columns:1fr 1fr;
  }

  .live-options {
    width:100%;
    margin-left:0;
    justify-content:space-between;
  }

  .live-options button {
    padding:8px;
  }

  .race-actions {
    gap:7px;
  }

  .cinema .race-panel {
    height:calc(100dvh - 80px);
  }

  h1 span {
    font-size:12px;
  }

  .header-actions {
    gap:5px;
  }

  .header-actions button {
    font-size:11px;
    padding:8px;
  }
}

@media(max-width:430px) {
  .opening #roster {
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  h1 {
    font-size:17px;
  }

  h1 span {
    display:none;
  }

  .opening-title h2 {
    font-size:26px;
  }
}

body {
  background:#f1f5ff;
}

header {
  border-bottom:0;
  box-shadow:0 1px 0 #2979ff15;
}

h1 {
  font-weight:950;
  letter-spacing:-1px;
  font-size:24px;
}

.opening {
  max-width:1450px;
  padding:38px 40px 48px;
}

.opening-title {
  position:relative;
  overflow:hidden;
  padding:30px 36px 34px;
  border-radius:22px;
  background:linear-gradient(115deg,#1253df,#2979ff 63%,#62a9ff);
  color:white;
  margin-bottom:26px;
  box-shadow:0 15px 45px #2979ff22;
}

.opening-tag {
  color:#d3e4ff;
  font-size:10px;
  letter-spacing:3px;
}

.opening-title h2 {
  font-size:42px;
  line-height:1.24;
  letter-spacing:-1.6px;
  margin:17px 0 14px;
  font-weight:950;
  position:relative;
}

.opening-title em {
  font-style:normal;
  color:#d5e9ff;
}

.opening-title p {
  font-size:14px;
  color:#e5efff;
  position:relative;
}

.title-number {
  position:absolute;
  right:45px;
  top:-55px;
  font-size:300px;
  line-height:1;
  font-style:italic;
  font-weight:950;
  letter-spacing:-30px;
  color:#ffffff12;
  pointer-events:none;
}

.opening-grid {
  grid-template-columns:minmax(0,1fr) 310px;
  gap:24px;
}

.lineup-card {
  padding:27px;
  border-radius:18px;
  border:0;
  box-shadow:0 8px 35px #143b8110;
}

.setup-card {
  border:0;
  border-radius:18px;
  padding:26px;
  box-shadow:0 8px 35px #143b8110;
}

.opening .panel-head h2 {
  border:0;
  padding-left:0;
  font-size:21px;
  letter-spacing:-.6px;
}

.panel-head h2 span {
  background:#eaf2ff;
  padding:4px 8px;
  border-radius:7px;
  margin-left:7px;
  font-size:13px;
}

.opening #roster {
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:12px;
}

.driver {
  border:2px solid transparent;
  background:#f4f7fd;
  padding:6px;
  border-radius:13px;
  color:#75839b;
  transition:transform .18s,box-shadow .18s;
}

.driver canvas {
  border-radius:9px;
  opacity:.55;
  filter:saturate(.5);
}

.driver.active {
  border-color:#2979ff;
  background:#fff;
  box-shadow:0 5px 14px #2979ff18;
}

.driver:hover {
  transform:translateY(-4px);
}

.driver strong {
  font-size:14px;
  padding:12px 0 5px;
  font-weight:800;
}

.driver .check {
  top:10px;
  right:10px;
  width:20px;
  height:20px;
  line-height:18px;
}

.driver.active .check {
  box-shadow:0 2px 8px #155cdf55;
}

.setup-heading h2 {
  font-size:22px;
  letter-spacing:-.5px;
}

.entry-summary {
  border-radius:10px;
  background:#f2f6ff;
  padding:17px 14px;
}

.entry-summary b {
  font-size:32px;
  letter-spacing:-1px;
}

.entry-summary small {
  font-size:9px;
  letter-spacing:1px;
}

.setting-block>label,.setting-block>.block-label {
  font-size:12px;
  font-weight:700;
}

.setting-block select {
  border-radius:9px;
  padding:12px;
}

.segmented button,.camera-controls button {
  border-radius:8px;
  padding:10px 7px;
}

.add-driver {
  padding-top:18px;
  margin-top:20px;
}

.add-driver input {
  padding:10px;
  font-size:12px;
}

.item-lineup {
  display:flex;
  justify-content:space-between;
  margin:22px 0 13px;
  gap:4px;
}

.item-lineup span {
  display:grid;
  place-items:center;
  background:#eef4ff;
  border:1px solid #e6eeff;
  width:28px;
  height:31px;
  border-radius:8px;
  font-size:17px;
  color:#2979ff;
}

.start-race {
  padding:18px 20px;
  border-radius:10px;
  font-size:16px;
  box-shadow:0 8px 20px #2979ff25;
}

.race-panel {
  border-radius:15px;
}

.rank-panel {
  border-radius:15px;
}

.leader {
  border-radius:8px;
  padding:9px 6px;
}

.leader:first-child {
  background:#e8f1ff;
}

.race-actions {
  padding:12px;
}

.primary {
  font-weight:800;
}

.race-hud>* {
  border-radius:7px;
}

.subtle {
  font-size:12px;
}

@media(max-width:1150px) {
  .opening #roster {
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .opening-grid {
    grid-template-columns:minmax(0,1fr) 290px;
  }

  .opening {
    padding:28px 24px;
  }

  .lineup-card,.setup-card {
    padding:22px;
  }
}

@media(max-width:750px) {
  .opening-grid {
    grid-template-columns:1fr;
  }

  .opening {
    padding:20px 16px;
  }

  .opening-title {
    border-radius:16px;
    padding:25px;
  }

  .opening-title h2 {
    font-size:31px;
  }

  .opening-title p {
    font-size:12px;
    max-width:260px;
  }

  .title-number {
    font-size:220px;
    right:20px;
    top:-10px;
  }

  .opening #roster {
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:8px;
  }

  .driver {
    padding:4px;
    border-radius:10px;
  }

  .driver strong {
    font-size:12px;
    padding:9px 0 4px;
  }

  .driver .check {
    width:16px;
    height:16px;
    line-height:14px;
    font-size:10px;
    top:7px;
    right:7px;
  }

  .lineup-card,.setup-card {
    padding:18px;
  }

  .item-lineup span {
    width:34px;
    height:34px;
  }

  .opening .panel-head h2 {
    font-size:18px;
  }
}

@media(max-width:430px) {
  .opening #roster {
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .opening-title h2 {
    font-size:28px;
  }
}

html,body,button,input,select,textarea {
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}

header .wordmark {
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:32px;
  font-weight:900;
  letter-spacing:-1.6px;
  display:flex;
  align-items:center;
}

header .wordmark span {
  font-size:inherit;
  font-weight:900;
  letter-spacing:inherit;
  margin:0;
  display:inline;
}

header .wordmark .kammon {
  color:#2979ff;
}

header .wordmark .rider {
  color:#111111;
}

.track-wrap,#game {
  background:#deeadf;
}

.track-name {
  font-weight:800;
  color:#2979ff!important;
}

@media(max-width:650px) {
  header .wordmark {
    font-size:27px;
  }

  .race-hud {
    gap:5px;
  }

  .race-hud>* {
    font-size:10px;
    padding:6px;
  }
}

.opening {
  padding-top:40px;
}

.opening-title {
  background:none;
  box-shadow:none;
  border-radius:0;
  padding:4px 0 28px;
  margin-bottom:0;
  overflow:visible;
  color:#111;
}

.opening-title .opening-wordmark {
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:44px;
  line-height:1.2;
  font-weight:900;
  letter-spacing:-2px;
  margin:0 0 14px;
  color:#111;
}

.opening-wordmark>span {
  color:#2979ff;
}

.opening-title p {
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;
  font-weight:400;
  line-height:1.65;
  color:#7a828e;
  margin:0;
  max-width:none;
}

.setup-card {
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;
  line-height:1.5;
}

.setup-heading {
  padding-bottom:16px;
  margin-bottom:20px;
}

.setup-heading h2 {
  font-size:20px;
  line-height:1.4;
  font-weight:800;
  letter-spacing:-.5px;
  margin:0;
}

.entry-summary>span,.setting-block>label,.setting-block>.block-label,.add-driver label {
  font-size:14px;
  line-height:1.5;
  font-weight:600;
  color:#526078;
  letter-spacing:-.2px;
}

.setting-block {
  margin-bottom:20px;
}

.setting-block>label,.setting-block>.block-label,.add-driver label {
  margin-bottom:8px;
}

.setup-card select,.setup-card .segmented button,.setup-card .camera-controls button,.setup-card .small-btn,.setup-card input {
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;
  line-height:1.4;
  font-weight:500;
  letter-spacing:-.2px;
}

.setup-card select,.setup-card .segmented button,.setup-card .camera-controls button {
  min-height:42px;
  padding:10px 8px;
  border-radius:8px;
}

.setup-card .segmented .active,.setup-card .camera-controls .active {
  font-weight:700;
}

.entry-summary b {
  font-size:28px;
  font-weight:800;
  line-height:1.2;
  letter-spacing:-.8px;
}

.entry-summary small {
  font-size:14px;
  font-weight:500;
  letter-spacing:0;
  color:#7a828e;
  margin-left:4px;
}

.setup-card .add-driver p {
  font-size:12px;
  font-weight:400;
  line-height:1.6;
}

.setup-card .start-race {
  font-size:16px;
  font-weight:700;
  line-height:1.4;
  letter-spacing:-.2px;
  min-height:50px;
  border-radius:8px;
}

.broadcast-tools {
  position:fixed;
  top:10px;
  right:14px;
  display:flex;
  gap:8px;
  z-index:5;
}

.broadcast-tools:has(button:not([hidden])) {
  padding:5px;
  background:#ffffffed;
  border:1px solid #eaedf2;
  border-radius:9px;
}

.workspace,.settings-closed .workspace {
  height:100dvh;
  padding-top:62px;
}

.cinema .workspace,.cinema.settings-closed .workspace {
  height:100dvh;
}

@media(max-width:750px) {
  .opening {
    padding-top:28px;
  }

  .opening-title {
    padding:0 0 24px;
  }

  .opening-title .opening-wordmark {
    font-size:36px;
    letter-spacing:-1.5px;
    margin-bottom:12px;
  }

  .opening-title p {
    font-size:14px;
    max-width:none;
  }

  .workspace,.settings-closed .workspace {
    height:auto;
    min-height:100dvh;
    padding-top:60px;
  }

  .cinema .race-panel {
    height:calc(100dvh - 75px);
  }

  .setup-heading h2 {
    font-size:20px;
  }

  .setup-card .segmented button,.setup-card .camera-controls button {
    font-size:14px;
  }
}

html,body {
  height:100%;
  margin:0;
}

.opening {
  height:100dvh;
  max-height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  gap:18px;
  padding:22px 32px;
  max-width:1450px;
}

.opening-title {
  flex:none;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  background:#fff;
  border:1px solid #eaedf2;
  border-radius:16px;
  box-shadow:0 2px 8px #16386904;
  padding:22px 28px;
  margin:0;
}

.opening-title .opening-wordmark {
  position:relative;
  z-index:1;
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:38px;
  font-weight:900;
  line-height:1.15;
  letter-spacing:-1.5px;
  margin:0 0 10px;
  color:#111;
}

.opening-title .opening-wordmark>span {
  font-family:inherit;
  font-size:inherit;
  font-weight:inherit;
  line-height:inherit;
  letter-spacing:inherit;
  margin:0;
  display:inline;
  color:#2979ff;
}

.opening-title p {
  position:relative;
  z-index:1;
  font-size:14px;
  line-height:1.5;
  margin:0;
  color:#7a828e;
}

.opening-watermark {
  position:absolute;
  right:34px;
  top:50%;
  transform:translateY(-50%);
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:156px;
  font-weight:900;
  line-height:1;
  letter-spacing:-10px;
  color:#2979ff08;
  pointer-events:none;
  z-index:0;
}

.opening-grid {
  flex:1;
  min-height:0;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:18px;
  align-items:stretch;
}

.lineup-card {
  min-height:0;
  overflow:hidden;
  padding:22px;
}

.opening #selection {
  height:100%;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.opening .panel-head,.opening .subtle,.opening .selection-bottom {
  flex:none;
}

.opening .subtle {
  margin:10px 0 14px;
}

.opening #roster {
  flex:1;
  min-height:0;
  overflow-y:auto;
  align-content:start;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:10px;
  padding:4px 4px 8px;
}

.opening .selection-bottom {
  margin-top:12px;
  padding-top:12px;
}

.setup-card {
  position:static;
  min-height:0;
  max-height:100%;
  overflow-y:auto;
  padding:20px;
}

.setup-heading {
  padding-bottom:12px;
  margin-bottom:14px;
}

.entry-summary {
  padding:12px;
  margin-bottom:16px;
}

.setting-block {
  margin-bottom:14px;
}

.add-driver {
  margin-top:16px;
  padding-top:16px;

 .opening .lineup-card,.opening .setup-card{flex:none;overflow:visible;max-height:none}
 .workspace,.settings-closed .workspace{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(110px,24%)}
 .race-panel{grid-row:1;height:auto;min-height:0;max-height:100%}
 .rank-panel{grid-row:2;height:auto;min-height:0;max-height:100%;padding:10px 8px}
 .rank-panel .panel-head{margin-bottom:8px}
 .race-actions{flex-shrink:0}
 .cinema .workspace,.cinema.settings-closed .workspace{grid-template-rows:minmax(0,1fr)}
 .cinema .race-panel{height:auto;min-height:0}
}

/* ------------------------------------------------------------------ 시작 화면 정리

   The two cards are one grid row, but they were styled as if they were unrelated:
   padding disagreed in three of the four breakpoint bands (22 vs 20, 16 vs 18, 12 vs
   18) and the headings never matched at all - 21px on an auto line-height next to
   20px/28px. That is what read as the columns not lining up. One padding scale and one
   header band for both cards fixes it at every width.

   The roster tools are plain text with hairline separators rather than three boxes:
   they are secondary to the cards themselves, and three outlined pills competed with
   the driver grid they sit above. */

.opening .lineup-card,.opening .setup-card{padding:22px}
.opening .panel-head,.opening .setup-heading{
 display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;
 padding:0 0 13px;margin:0 0 15px;border:0;border-bottom:1px solid var(--color-border);
}
.opening .panel-head h2,.opening .setup-heading h2{
 margin:0;font:800 19px/1.4 Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.5px;color:var(--color-text-main);
}

.roster-actions{display:flex;flex-wrap:wrap;align-items:center;margin-left:auto}
.tool-btn{
 border:0;background:none;border-radius:0;
 padding:2px 12px;
 font:600 13px/1.5 Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.2px;
 color:var(--color-text-sub);white-space:nowrap;
}
.tool-btn+.tool-btn{border-left:1px solid var(--color-border)}
.tool-btn:last-child{padding-right:0}
.tool-btn:hover{background:none;color:var(--color-primary)}
.tool-btn:active{color:var(--color-primary-deep)}

.opening #addDriverForm p{font-size:12px;font-weight:400;line-height:1.6;color:#67788f}

/* 아이템 목록은 조작 항목이 아니라 안내라서 위에 구분선을 두고 떼어 놓는다. */
.setup-card .item-block{border-top:1px solid var(--color-border);padding-top:16px;margin:18px 0 2px}
.setup-card .item-block .item-lineup{margin:0}

@media (max-width:1024px){
 .opening .lineup-card,.opening .setup-card{padding:18px}
 .opening .panel-head,.opening .setup-heading{padding-bottom:11px;margin-bottom:13px}
}
@media (max-width:750px){
 .opening .lineup-card,.opening .setup-card{padding:15px}
 .opening .panel-head h2,.opening .setup-heading h2{font-size:18px}
 .opening .panel-head,.opening .setup-heading{padding-bottom:10px;margin-bottom:12px}
 .tool-btn{padding:2px 10px;font-size:12.5px}
}
/* The header row has to stay one line down to the narrowest phone in use (320px).
   It was 22px short there, so the tools give up padding and then a little size as the
   viewport narrows - the labels themselves never change. */
@media (max-width:420px){
 .opening .panel-head{column-gap:10px}
 .tool-btn{padding:2px 8px}
 .tool-btn:first-child{padding-left:0}
}
@media (max-width:360px){
 .opening .panel-head{column-gap:8px}
 .opening .panel-head h2 span{padding:3px 6px;margin-left:5px;font-size:12px}
 .tool-btn{padding:2px 6px;font-size:12px}
}
@media (max-width:330px){
 .opening .panel-head{column-gap:6px}
 .tool-btn{padding:2px 5px;font-size:11.5px;letter-spacing:-.4px}
}
@media (max-width:305px){
 .opening .panel-head h2,.opening .setup-heading h2{font-size:16px}
 .tool-btn{padding:2px 4px;font-size:11px}
}

/* FINAL LAP 배지는 처음부터 자리에 있고 투명할 뿐이다. hidden 을 벗기는 순간
   HUD 한 줄이 통째로 다시 배치되는데, 하필 마지막 바퀴 진입이라 화면이 가장
   바쁜 순간과 겹친다. 전역 [hidden] 규칙이 !important 라 여기서도 맞받는다. */
.race-hud #finalBadge[hidden]{display:inline-block!important;visibility:hidden}

// 예전에는 선수마다 42x42 캔버스를 따로 만들었다. 소프트웨어 렌더링에서는 아무 차이가
// 없지만, GPU 가 그리는 브라우저에서는 한 프레임에 서로 다른 텍스처를 최대 48개
// 물려야 한다는 뜻이다. 텍스처가 많으면 브라우저가 캔버스를 GPU 에 두지 못하고
// 소프트웨어로 강등하거나 다시 승격하는 일이 생기고, 그 전환은 한 번에 수백 ms 다.
// 이제 프레임마다 쓰이는 텍스처는 트랙 래스터와 이 아틀라스 둘뿐이다.
const FACE_PX=42,FACE_COLS=8;
let faceAtlas=null,faceAtlasCtx=null;
const faceSlots=new Map();
function kartFaceSlot(id){
 let slot=faceSlots.get(id);
 if(slot!==undefined)return slot;
 if(!faceAtlas){
  faceAtlas=document.createElement('canvas');
  faceAtlas.width=FACE_PX*FACE_COLS;
  faceAtlas.height=FACE_PX*Math.ceil(MAX_DRIVERS/FACE_COLS);
  faceAtlasCtx=faceAtlas.getContext('2d');
 }
 slot=faceSlots.size;
 const sx=(slot%FACE_COLS)*FACE_PX,sy=Math.floor(slot/FACE_COLS)*FACE_PX,b=faceAtlasCtx;
 b.save();b.beginPath();b.arc(sx+FACE_PX/2,sy+FACE_PX/2,FACE_PX/2,0,Math.PI*2);b.clip();
 if(portraits[id])b.drawImage(portraits[id],sx,sy,FACE_PX,FACE_PX);
 b.restore();
 faceSlots.set(id,slot);
 return slot;
}
// 아틀라스에 쓰는 일은 레이스 시작 때 다 끝낸다. 그리는 도중에 텍스처 원본을 고치면
// 그 프레임에 다시 업로드해야 한다.
function warmKartFaces(){for(const r of racers){kartFaceSlot(r.id);bodySlot(r.id,false);bodySlot(r.id,true);}}
function drawKartFace(id,x,y,size){
 const slot=kartFaceSlot(id),sx=(slot%FACE_COLS)*FACE_PX,sy=Math.floor(slot/FACE_COLS)*FACE_PX;
 g.drawImage(faceAtlas,sx,sy,FACE_PX,FACE_PX,x,y,size,size);
}

// One name, validated and registered. Throws with the reason it could not be added.
function registerDriver(raw){
 if(state!=='setup')throw Error('라인업 변경 화면에서 선수를 추가해 주세요.');
 const name=String(raw).trim().replace(/\s+/g,' ');
 if(!name||Array.from(name).length>16)throw Error('이름을 1~16자로 입력해 주세요.');
 if(names.some(n=>n.toLocaleLowerCase()===name.toLocaleLowerCase()))throw Error('같은 이름의 선수가 이미 있습니다.');
 if(names.length>=MAX_DRIVERS)throw Error('최대 48명까지 등록할 수 있습니다.');
 const id=names.length;names.push(name);
 colors.push(['#9ed978','#f5b263','#8ccfee','#d99be7','#f38eac'][(id-BASE_DRIVERS)%5]);
 portraits[id]=portrait(id);addCard(id);chosen.add(id);

}
function addDriver(raw){const entry=registerDriver(raw);syncSelection();return entry.id;}
// One field, any number of guests: the input splits on commas (and newlines, so a
// pasted list works too) and each name is judged on its own - one bad entry skips
// itself instead of throwing the whole batch away.
function addGuests(raw){
 const parts=String(raw).split(/[,\uFF0C\n]/).map(t=>t.trim()).filter(Boolean);
 if(!parts.length)throw Error('이름을 1~16자로 입력해 주세요.');
 const added=[],skipped=new Map();
 for(const part of parts){
  try{added.push(registerDriver(part).name);}
  catch(err){const list=skipped.get(err.message)||[];list.push(part);skipped.set(err.message,list);}
 }
 syncSelection();
 return {added,skipped};
}
const nameList=(arr,max=5)=>arr.length<=max?arr.join(', '):arr.slice(0,max).join(', ')+' 외 '+(arr.length-max)+'명';
// A text input cannot hold newlines - paste a column of names and the browser welds
// them into one word. Turn the line breaks into the separator the field does understand.
$('driverName').addEventListener('paste',e=>{
 const text=(e.clipboardData||globalThis.clipboardData||{}).getData?.('text');
 if(!text||!/[\n\r\t]/.test(text))return;
 e.preventDefault();
 const input=$('driverName');
 const cleaned=text.split(/[\n\r\t]+/).map(t=>t.trim()).filter(Boolean).join(', ');
 const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;
 input.value=input.value.slice(0,start)+cleaned+input.value.slice(end);
 const caret=start+cleaned.length;
 if(input.setSelectionRange)input.setSelectionRange(caret,caret);
});

 else if(added.length>1)lines.push(added.length+'명 추가: '+nameList(added)+' · 이번 경기용 선수입니다. 선수 선택으로 돌아오면 초기화됩니다.');
 for(const [reason,list] of skipped)lines.push(list.length+'명 제외 — '+reason+' ('+nameList(list,3)+')');
 $('driverMessage').textContent=lines.join(' / ');
 // Keep whatever failed in the box so it can be corrected without retyping the rest.
 const failed=[...skipped.values()].flat();
 $('driverName').value=failed.join(', ');
};
